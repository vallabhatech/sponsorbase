name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json

      # Frontend Linting & Typechecking
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Typecheck Frontend
        working-directory: ./frontend
        run: npx tsc --noEmit

      # Backend Linting & Typechecking (if package.json exists)
      - name: Check Backend Setup
        id: check-backend
        run: |
          if [ -f "backend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Backend Dependencies
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: ./backend
        run: npm ci

      - name: Typecheck Backend
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: ./backend
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sponsorbase
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sponsorbase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test -- --coverage --passWithNoTests

      - name: Check Backend Setup
        id: check-backend
        run: |
          if [ -f "backend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Backend Dependencies
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Tests
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: ./backend
        run: npm test -- --coverage --passWithNoTests

  build:
    name: Build Compilations
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Check Backend Setup
        id: check-backend
        run: |
          if [ -f "backend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Backend Dependencies
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: ./backend
        run: npm ci

      - name: Build Backend
        if: steps.check-backend.outputs.exists == 'true'
        working-directory: ./backend
        run: npm run build --if-present
